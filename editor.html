<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스무고개 편집</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>스무고개 편집</h1>
  <a class="home-link" href="index.html" target="_blank">시작 페이지 보기</a>
</header>

<main>
  <div class="guide-box">
    <strong>문제 바꾸는 방법</strong>
    <ol>
      <li>서버를 추가·삭제하거나 이름을 바꾸고, 서버마다 정답과 힌트 10개를 입력합니다.
        (정답을 여러 형태로 인정하려면 쉼표로 구분: <code>이순신, 이순신 장군</code>)</li>
      <li><strong>미리 플레이</strong>로 확인한 뒤 <strong>quiz.json 다운로드</strong>를 누릅니다.</li>
      <li>GitHub 저장소의 <code>data/quiz.json</code> 파일을 내려받은 파일로 교체(업로드)하면 1~2분 뒤 학생 화면에 반영됩니다.</li>
    </ol>
    <p class="hint">편집 내용은 이 브라우저에 자동으로 저장되지만, 파일을 올리기 전까지 학생에게는 보이지 않습니다.</p>
  </div>

  <nav class="server-tabs" id="server-tabs"></nav>

  <div class="server-panel">
    <div class="meta-row">
      <label>서버 이름 <input id="name-input" type="text" placeholder="예: 1반"></label>
      <label class="check-label"><input type="checkbox" id="shuffle-check"> 들어올 때마다 문제 순서 섞기</label>
      <span class="meta-actions">
        <button id="move-left-btn" type="button" title="시작 페이지에서 앞으로">◀ 앞으로</button>
        <button id="move-right-btn" type="button" title="시작 페이지에서 뒤로">뒤로 ▶</button>
        <button id="delete-server-btn" type="button" class="danger">이 서버 삭제</button>
      </span>
    </div>

    <div id="problem-list"></div>

    <div class="row-actions">
      <button id="add-problem-btn" type="button">+ 문제 추가</button>
      <button id="load-example-btn" type="button">예시 불러오기</button>
      <button id="reset-btn" type="button">이 서버 문제 전체 삭제</button>
    </div>
  </div>

  <div class="editor-actions">
    <button id="preview-btn" type="button">미리 플레이</button>
    <button id="download-btn" type="button" class="primary">quiz.json 다운로드</button>
    <label class="file-btn">
      quiz.json 불러오기
      <input id="import-input" type="file" accept="application/json">
    </label>
    <button id="reload-btn" type="button">사이트 파일로 되돌리기</button>
  </div>

  <p id="editor-status" class="status"></p>
</main>

<script src="common.js"></script>
<script src="editor.js"></script>
</body>
</html>
